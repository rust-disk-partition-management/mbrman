[package]
name = "mbrman"
version = "0.6.1"
authors = ["Cecile Tonglet <cecile.tonglet@cecton.com>"]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A library for reading and managing MBR partition tables"
repository = "https://github.com/rust-disk-partition-management/mbrman"
homepage = "https://github.com/rust-disk-partition-management/mbrman"
documentation = "https://docs.rs/mbrman"
readme = "README.md"
keywords = ["mbr", "partition", "table", "filesystem", "disk"]
categories = ["filesystem"]
include = ["src/**/*.rs", "tests/fixtures/*.img", "README.md", "CHANGELOG.md", "LICENSE.Apache-2.0", "LICENSE.MIT"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["std"]
# Implement the disk traits for `std::io` types and use `std::io::Error`
std = ["alloc", "thiserror/std"]
# The `MBR` type, to edit partition tables
alloc = []

[dependencies]
thiserror = { version = "2.0.12", default-features = false }
